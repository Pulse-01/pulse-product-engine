name: Shopify connection test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-shopify:
    name: Verify Shopify Admin API
    runs-on: ubuntu-latest
    env:
      SHOPIFY_STORE_DOMAIN: pulse-01.myshopify.com
      SHOPIFY_API_VERSION: "2026-07"
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}

    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          if [[ -z "$SHOPIFY_CLIENT_ID" || -z "$SHOPIFY_CLIENT_SECRET" ]]; then
            echo "::error::Add SHOPIFY_CLIENT_ID and SHOPIFY_CLIENT_SECRET as repository secrets."
            exit 1
          fi

      - name: Request short-lived Shopify token
        id: token
        shell: bash
        run: |
          response="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              "https://$SHOPIFY_STORE_DOMAIN/admin/oauth/access_token" \
              --header "Content-Type: application/json" \
              --data "$(jq -nc \
                --arg client_id "$SHOPIFY_CLIENT_ID" \
                --arg client_secret "$SHOPIFY_CLIENT_SECRET" \
                '{grant_type:"client_credentials",client_id:$client_id,client_secret:$client_secret}')"
          )"

          access_token="$(jq -er '.access_token' <<<"$response")"
          echo "::add-mask::$access_token"
          echo "access_token=$access_token" >> "$GITHUB_OUTPUT"

      - name: Verify store and product access
        shell: bash
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ steps.token.outputs.access_token }}
        run: |
          query='query ConnectionTest {
            shop {
              name
              myshopifyDomain
            }
            products(first: 5, sortKey: TITLE) {
              nodes {
                title
                handle
                status
              }
            }
          }'

          response="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              "https://$SHOPIFY_STORE_DOMAIN/admin/api/$SHOPIFY_API_VERSION/graphql.json" \
              --header "Content-Type: application/json" \
              --header "X-Shopify-Access-Token: $SHOPIFY_ACCESS_TOKEN" \
              --data "$(jq -nc --arg query "$query" '{query:$query}')"
          )"

          if [[ "$(jq '.errors | length // 0' <<<"$response")" -gt 0 ]]; then
            jq -r '.errors[]?.message' <<<"$response" >&2
            exit 1
          fi

          shop_name="$(jq -r '.data.shop.name' <<<"$response")"
          shop_domain="$(jq -r '.data.shop.myshopifyDomain' <<<"$response")"
          product_count="$(jq '.data.products.nodes | length' <<<"$response")"

          {
            echo "## Shopify connection verified"
            echo
            echo "- Store: **$shop_name**"
            echo "- Domain: `$shop_domain`"
            echo "- Products returned: **$product_count**"
            echo
            echo "### First products"
            jq -r '.data.products.nodes[]? | "- **\(.title)** (\(.status)) — `\(.handle)`"' <<<"$response"
          } >> "$GITHUB_STEP_SUMMARY"
